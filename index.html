<!doctype html>
<meta charset="utf-8">
<html lang=en>
<title>Unifrost</title>
<script src=src/main.ts type=module></script>
<style>
	body{
		background-color:#000;
		display:grid;
		place-content:center;
		height:100vh;
		user-select:none;
	}
	body>*{
		grid-area:1/1;
	}
	canvas{
		border:#731 solid 2px;
	}
	q{
		background:#fff;
		color:#731;
		margin:22px;
		padding:13px;
		border:2px solid;
		border-radius:13px;
		corner-shape:scoop;
		align-self:start;
		font-family:serif;
		font-size:22px;
		text-align:center;
		width:570px;
	}
	p{
		color:#731;
		font-size:22px;
		font-weight:bold;
		-webkit-text-stroke: 1px #fff;
		margin:0;
	}
	#victoryTxt{
		font-size: 66px;
		align-self:center;
		justify-self:center;
		text-align: center;
	}
	#timers{
		align-self:end;
		justify-self:end;
		padding:10px;
	}
	#timers p{
		font-family:monospace;
		text-align: end;
	}
	i{
		font-family:sans-serif;
	}
</style>
<canvas id=canvas width=640 height=480></canvas>
<q id="txt">Loading...</q>
<div id="victoryTxt">
	<p style=font-size:66px>Thanks for playing!
	<p>Press R to start from the beginning</p>
</div>
<div id="timers">
	<p id="curTimer">
	<p><i>Best: </i><span id="bestTimer"></span>
</div>
